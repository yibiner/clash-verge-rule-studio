<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2196F3"/>
      <stop offset="100%" stop-color="#1565C0"/>
    </linearGradient>
    <linearGradient id="rs-accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#rs-bg)"/>
  <!-- Subtle grid / rule rails -->
  <g stroke="rgba(255,255,255,0.16)" stroke-width="10" stroke-linecap="round">
    <line x1="92" y1="144" x2="420" y2="144"/>
    <line x1="92" y1="256" x2="420" y2="256"/>
    <line x1="92" y1="368" x2="420" y2="368"/>
  </g>
  <!-- Split-tunnel routing branches -->
  <g fill="none" stroke="url(#rs-accent)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <!-- Input trunk -->
    <path d="M 104 256 L 210 256"/>
    <!-- Upper branch -->
    <path d="M 210 256 C 254 256, 266 154, 318 154 L 386 154"/>
    <!-- Middle straight branch -->
    <path d="M 210 256 L 386 256"/>
    <!-- Lower branch -->
    <path d="M 210 256 C 254 256, 266 358, 318 358 L 386 358"/>
  </g>
  <!-- Source node -->
  <circle cx="104" cy="256" r="30" fill="#FFFFFF"/>
  <!-- Decision hub -->
  <circle cx="210" cy="256" r="34" fill="#1565C0" stroke="#FFFFFF" stroke-width="20"/>
  <!-- Target policy nodes -->
  <circle cx="394" cy="154" r="28" fill="#FFFFFF"/>
  <circle cx="394" cy="256" r="28" fill="#93C5FD" stroke="#FFFFFF" stroke-width="14"/>
  <circle cx="394" cy="358" r="28" fill="#FFFFFF"/>
</svg>
